# V FOR X mirror — hardened static nginx config
# Privacy by default: no logging, no third-party deps, defensive headers.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # ── Security headers ────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # ── No access logs (privacy by default) ─────────────────
    access_log off;
    error_log  /dev/stderr warn;

    # ── Static SPA fallback ─────────────────────────────────
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Long-cache immutable hashed assets
    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # Never serve hidden files or the manifest
    location ~ /\.  { deny all; }
    location = /.vfx-manifest.json { default_type application/json; }
}

# Stub so `nginx -t` is happy without a separate `server` for healthchecks
server {
    listen 127.0.0.1:8081;
    server_name _;
    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }
}
